[project]
name = "orchestra"
version = "0.1.0"
description = "Preparation environment for query-routing classifier experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
