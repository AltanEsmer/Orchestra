[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Preparation environment for query-routing classifier experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
